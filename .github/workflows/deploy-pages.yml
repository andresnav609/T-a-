name: Deploy My First Investment a GitHub Pages

on:
  push:
    branches:
      - claude/data-sync-share-prototype-rvhc0v
      - main
    paths:
      - 'my-first-investment/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-first-investment/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: my-first-investment
      - name: Tests
        run: npm test
        working-directory: my-first-investment
      - name: Build
        run: npm run build
        working-directory: my-first-investment
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: my-first-investment/dist
          publish_branch: gh-pages
          enable_jekyll: false
          # Conserva prices.json (lo publica el workflow nocturno de acciones).
          keep_files: true
          commit_message: 'Deploy My First Investment'
