name: Deploy My First Investment a GitHub Pages

on:
  push:
    branches:
      - claude/data-sync-share-prototype-rvhc0v
      - main
    paths:
      - 'my-first-investment/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-first-investment/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: my-first-investment
      - name: Tests
        run: npm test
        working-directory: my-first-investment
      - name: Build
        run: npm run build
        working-directory: my-first-investment
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: my-first-investment/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
